name: Monthly health check
on:
  schedule: [{ cron: "17 6 1 * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:setup-python
      - run: pnpm verify
        env: { BTH_EXECUTION_MODE: snapshot, NEXT_PUBLIC_DATA_STATUS: fixture }
