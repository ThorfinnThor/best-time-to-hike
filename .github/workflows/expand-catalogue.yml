name: Expand destination catalogue

# Activates candidate destinations through the same path that published the
# current catalogue: CI holds the CDS credential, downloads and validates the
# sources, and commits only compact snapshots that passed every gate.
# Nothing runs locally and no credential leaves this runner.

on:
  workflow_dispatch:
    inputs:
      destinations:
        description: "Comma-separated candidate ids to activate. Leave empty to activate the whole candidate file."
        required: false
        default: ""
      candidates_file:
        description: "Candidate file to draw from"
        required: false
        default: "data-config/sources/destination-candidates-batch-2.json"
      publish:
        description: "Commit the verified dataset. Unchecked runs upload evidence only and change nothing."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: expand-catalogue
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BTH_EXECUTION_MODE: ingest-staging
      BTH_CDS_CONCURRENCY: 5
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      NEXT_PUBLIC_DATA_STATUS: provisional
      NEXT_PUBLIC_APP_URL: https://best-time-to-hike.pages.dev
      # Scopes both the download and the aggregation to the activated set, so
      # destinations that are already published are never re-fetched and their
      # committed snapshots are never rewritten.
      BTH_DESTINATIONS: ${{ inputs.destinations }}
      CANDIDATES_FILE: ${{ inputs.candidates_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-data.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:setup-python

      # A cache key cannot exceed 512 characters and a selection can name a
      # hundred destinations, so the key carries a digest of the selection
      # rather than the selection itself.
      - name: Derive a cache id for this selection
        id: selection
        run: |
          digest=$(printf '%s' "${BTH_DESTINATIONS:-full-batch}" | sha256sum | cut -c1-16)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Selection digest: $digest"

      - name: Preflight the model orography before any climate download
        run: pnpm data:catalogue-preflight --candidates="$CANDIDATES_FILE" ${BTH_DESTINATIONS:+--only="$BTH_DESTINATIONS"}

      - name: Activate the selected candidates
        run: pnpm data:catalogue-prepare --candidates="$CANDIDATES_FILE" ${BTH_DESTINATIONS:+--only="$BTH_DESTINATIONS"}

      - name: Cache canonical ERA5-Land point series between fail-closed retries
        id: era5-cache
        uses: actions/cache/restore@v4
        with:
          path: generated/intermediate/era5-raw
          key: era5-land-point-series-v2-${{ steps.selection.outputs.digest }}
          restore-keys: |
            era5-land-point-series-v2-

      - name: Fetch the official 1991-2020 ERA5-Land point series
        run: pnpm data:era5 -- --provisional --download-only

      - name: Save canonical point series before the scientific gates
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: generated/intermediate/era5-raw
          key: era5-land-point-series-v2-${{ steps.selection.outputs.digest }}-${{ github.run_id }}

      - name: Aggregate the point series into committed snapshots
        run: pnpm data:era5 -- --provisional

      - name: Build and verify the complete static site
        run: pnpm verify

      - name: Report what the scientific gates withheld
        if: ${{ always() }}
        run: |
          node --input-type=module -e '
            import {readFileSync,readdirSync} from "node:fs";
            const root="public/data/hiking/destinations";
            const files=readdirSync(root,{recursive:true}).filter((f)=>String(f).endsWith(".json")&&String(f).includes("/"));
            let total=0,eligible=0;const withheld=[];
            for(const f of files){
              const d=JSON.parse(readFileSync(`${root}/${f}`,"utf8"));
              const n=d.months.filter((m)=>m.recommendationEligible).length;
              total+=d.months.length;eligible+=n;
              if(!d.recommendationEligible)withheld.push(`${d.slug} (${d.recommendationHoldReason??"no eligible month"})`);
            }
            console.log(`destinations: ${files.length}`);
            console.log(`destination-months: ${total} — ${eligible} eligible, ${total-eligible} withheld`);
            console.log(`withheld destinations: ${withheld.length?withheld.join(", "):"none"}`);
          '

      - name: Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-expansion-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            generated/intermediate/era5-raw/*.meta.json
            generated/intermediate/representative-catalogue/era5-land-orography.json
            generated/reports/*.json
            data-snapshots/climate/*.json

      - name: Commit only the verified static dataset
        if: ${{ inputs.publish }}
        run: |
          git config user.name "best-time-to-hike-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-config/sources/destinations.json data-config/geography/destination-areas.geojson data-snapshots public/data/hiking
          count=$(printf '%s' "${BTH_DESTINATIONS}" | awk -F, '{print NF}')
          git diff --cached --quiet || git commit -m "data: activate ${count:-all} candidate destinations"
          git push
