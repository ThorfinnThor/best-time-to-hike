name: Observation validity cache-only pilot
on:
  push:
    branches: [codex/observation-validity-pilot]
    # Export-only changes can reuse the uploaded monthly evidence; CI still tests them.
    paths:
      - 'lib/hiking/climate*.ts'
      - 'lib/hiking/daylight.ts'
      - 'scripts/validate/prepare-cached-validity-input.ts'
      - 'scripts/validate/inventory-validity-cache.ts'
      - 'data-config/methodology/observation-validity-v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Targeted regression follow-up; the preceding run covered all ten scope points.
      BTH_VALIDITY_DESTINATIONS: denali
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore exact existing raw cache, never download new climate data
        uses: actions/cache/restore@v4
        with:
          path: generated/intermediate/era5-raw
          key: era5-land-cell-replacements-v1-34139951879
          fail-on-cache-miss: true
      - run: pnpm exec tsc --noEmit && node --import tsx --test tests/climate-validity.test.ts tests/snow-screening.test.ts
      - name: Inventory and compare the bounded cache-only sample
        run: |
          node --import tsx scripts/validate/inventory-validity-cache.ts > generated/intermediate/validity-destinations.txt
          while read -r destination; do
            node --import tsx scripts/validate/prepare-cached-validity-input.ts "$destination"
            node --import tsx scripts/validate/compare-observation-validity.ts "generated/intermediate/validity-pilot/$destination-input.json" "generated/intermediate/validity-pilot/$destination-report.json"
          done < generated/intermediate/validity-destinations.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observation-validity-pilot-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            generated/intermediate/validity-pilot/*-report.json
            generated/intermediate/validity-pilot/*-source-evidence.json
            generated/intermediate/validity-pilot/cache-inventory.json
            data-config/methodology/validity-migration-decision-v1.json
            data-config/methodology/observation-validity-v1.json
            data-config/methodology/snow-screening-clarification-v1.json
            docs/sol-validity-migration-decision-2026-09-08.md
