name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env: { BTH_EXECUTION_MODE: snapshot, NEXT_PUBLIC_DATA_STATUS: fixture, NEXT_PUBLIC_APP_URL: "https://best-time-to-hike.pages.dev" }
      - run: pnpm exec wrangler pages deploy out --project-name=best-time-to-hike --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
